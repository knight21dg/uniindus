<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59416" />
      <stop offset="40%" stop-color="#FDB813" />
      <stop offset="100%" stop-color="#FFE484" />
    </linearGradient>
    <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#030B1E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Crisp White Circle Base with Gold Ring for High Tab Visibility -->
  <circle cx="250" cy="250" r="235" fill="#FFFFFF" stroke="#FDB813" stroke-width="16" />
  
  <!-- Outer Navy U Shape -->
  <path fill="url(#navy-grad)" filter="url(#shadow)" d="M 125 125 L 165 125 L 165 245 C 165 315 205 345 250 345 C 295 345 335 315 335 245 L 335 160 L 375 160 L 375 245 C 375 345 320 390 250 390 C 180 390 125 345 125 245 Z" />
  
  <!-- Globe at top center -->
  <g transform="translate(250, 125)">
    <circle cx="0" cy="0" r="45" fill="#0B1B3D" stroke="#FFFFFF" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="22" ry="45" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="45" ry="22" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#FFFFFF" stroke-width="2" />
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#FFFFFF" stroke-width="2" />
  </g>
  
  <!-- Swirling Gold Arrow -->
  <path fill="url(#gold-grad)" d="M 130 345 C 175 365 285 320 355 200 L 330 180 L 395 65 L 400 185 L 375 165 C 310 275 200 325 130 305 Z" />
</svg>